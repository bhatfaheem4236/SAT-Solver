<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sat Solver</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class ="container">
        <h1>SAT Solver</h1>
        <p class = "subtitle"> Enter a CNF formula as clause, one per line(e.g. <code>1-2</code>)</p>

        <textarea id = "formulaInput" placeholder="1 -2 &#10; 2 3 &#10;-1 3"></textarea>

        <button id ="solveBtn">Solve</button>
        <div id = "result"></div>
    </div>
    <script src = "script.js"></script>
    
</body>
</html>
